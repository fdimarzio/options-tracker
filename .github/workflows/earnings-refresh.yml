name: Earnings Dates Refresh

on:
  schedule:
    - cron: '0 10 * * *'  # daily at 6am ET / 10:00 UTC, before market open
  workflow_dispatch:        # manual trigger anytime

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run earnings_dates refresh
        env:
          VITE_SUPABASE_URL: https://ufagnokxmetushstgrip.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: node scripts/earnings-refresh.js
