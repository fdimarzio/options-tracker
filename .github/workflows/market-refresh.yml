name: Market Refresh

on:
  schedule:
    # Token keeper: daily at 8am ET (12:00 UTC) — resets 7-day refresh token window
    - cron: '0 12 * * *'
    # ETrade pre-expiry renew: daily at 11:50pm ET (3:50 UTC) — before midnight expiry
    - cron: '50 3 * * *'
    # Weekend reconciliation: Sat & Sun morning, ~9am ET (13:00 UTC) — catches broker
    # settlement transactions (e.g. a Friday expiry close) that post over the weekend
    # while no weekday run is happening to pick them up. Market is closed so this only
    # checks for new transactions, not a full quote/chain refresh.
    - cron: '0 13 * * 0,6'
  workflow_dispatch:

# Daytime market-refresh/chain-refresh/auto-import curls removed — cron-jobs.org
# now owns those (Market Refresh, Chain Refresh, Auto Import jobs hitting the same
# Vercel endpoints). This workflow keeps only what cron-jobs.org doesn't cover:
# the Schwab refresh-token 7-day keepalive and weekend settlement reconciliation.
jobs:
  token-keeper:
    if: github.event.schedule == '0 12 * * *' || github.event.schedule == '50 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Keep Schwab refresh token alive
        run: |
          echo "Refreshing Schwab token via schwab-proxy..."
          # Fetching a simple AAPL quote forces schwab-proxy to validate + refresh
          # the access token and save it back to Supabase — no separate endpoint needed
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://options-tracker-five.vercel.app/api/schwab-proxy?path=/marketdata/v1/quotes&symbols=AAPL&fields=quote&x-cron-secret=${{ secrets.CRON_SECRET }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Token refresh failed! Manual re-auth may be required at:"
            echo "https://options-tracker-five.vercel.app/api/schwab-auth"
            exit 1
          fi
          echo "Token refreshed successfully."

      - name: Renew ETrade access token
        # cron-jobs.org's Extend Etrade Token job already covers this. A nightly-expired
        # ETrade token here is expected/redundant, not fatal — must not fail the job.
        continue-on-error: true
        run: |
          echo "Renewing ETrade token..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://options-tracker-five.vercel.app/api/etrade?action=renew&secret=${{ secrets.CRON_SECRET }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: ETrade token renewal failed (status $HTTP_STATUS) — manual re-auth required at:"
            echo "https://options-tracker-five.vercel.app/api/etrade?action=auth"
            echo "A Pushover notification has been sent (if 401 — same-day renewal window missed)."
            exit 1
          fi
          echo "ETrade token renewed successfully."

  weekend-reconcile:
    if: github.event.schedule == '0 13 * * 0,6'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check for weekend-posted settlement transactions
        run: |
          curl -s -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 20 "https://options-tracker-five.vercel.app/api/auto-import"
